<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Abdurahmon Abdurahmonov</title>
  <meta name="description" content="Marketing, treyd-marketing va SMM haqida maqolalar — Abdurahmon Abdurahmonov blogi." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='middle' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='30' font-weight='700' fill='%23fff'%3EAA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("site-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="nav-logo" data-field="name">Abdurahmon Abdurahmonov</a>
      <nav class="nav-links">
        <a href="../index.html#about" data-i18n="nav.about">Men haqimda</a>
        <a href="../index.html#experience" data-i18n="nav.experience">Mehnat faoliyatim</a>
        <a href="../index.html#education" data-i18n="nav.education">Ta'lim</a>
        <a href="../index.html#services" data-i18n="nav.services">Kasbiy yo'nalishlar</a>
        <a href="../index.html#skills" data-i18n="nav.skills">Ko'nikmalar</a>
        <a href="../index.html#projects" data-i18n="nav.projects">Yutuqlarim</a>
        <a href="index.html" data-i18n="nav.blog">Blog</a>
        <a href="../index.html#recommendations" data-i18n="nav.recommendations">Tavsiyalar</a>
        <a href="../index.html#contact" data-i18n="nav.contact">Bog'lanish</a>
      </nav>
      <div class="nav-actions">
        <div class="lang-switch">
          <button data-lang="uz">UZ</button>
          <button data-lang="ru">RU</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="theme-toggle" data-i18n-aria="a11y.theme" aria-label="Mavzuni almashtirish" aria-pressed="false">
          <span class="theme-toggle-icon">🌙</span>
        </button>
        <button class="nav-toggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-header">
          <span class="section-label" data-i18n="blog.label">Blog</span>
          <h2 data-i18n="blog.title">So'nggi maqolalar</h2>
        </div>
        <div class="blog-list" id="blog-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span data-field="name">Abdurahmon Abdurahmonov</span> &middot; <span id="footer-year"></span> &middot;
      <span data-i18n="footer.rights">Barcha huquqlar himoyalangan.</span>
    </div>
  </footer>

  <script src="../data/content.js"></script>
  <script src="../data/posts.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/blog.js"></script>
  <script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();

    // Mobil menyu (index.html dagi main.js ni bu yerda ulamaymiz, shuning uchun
    // minimal toggle mantiqi shu yerda takrorlanadi)
    document.querySelector(".nav-toggle").addEventListener("click", () => {
      document.querySelector(".site-header").classList.toggle("nav-open");
    });
  </script>
</body>
</html>
